<!DOCTYPE html>
<html lang="en">
    
    <head>
        
        <meta charset="UTF-8">
        
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>Garlic Bread | The Food Spot</title>
        
        <link rel="stylesheet" href="style.css">
    
    </head>
    
    <body>
        
        <header>
            
            <h1>The Food Spot</h1>
            
            <p>Fresh food, happy people!</p>
        
        </header>
        
        <nav>
            
            <a href="index.html">Home</a>
            
            <a href="starters.html">Starters</a>
            
            <a href="meals.html">Meals</a>
            
            <a href="desserts.html">Desserts</a>
            
            <a href="drinks.html">Drinks</a>
        
        </nav>
        
        <main>
            
            <div class="detail">
                
                <img src="garlic%20bread.jfif" alt="Garlic Bread">
                
                <h2>Garlic Bread</h2>
                
                <p class="price">R45</p>
                
                <p><strong>Serving size:</strong> 2 slices</p>
                
                <p>Toasted bread with garlic butter and herbs.</p>
                
                <form action="thank-you.html" method="get">
                    
                    <h3>Choose your extras</h3>
                    
                    <label><input type="checkbox" name="extras" value="Extra chips (+R25)"> Extra chips (+R25)</label>
                    
                    <label><input type="checkbox" name="extras" value="Soft drink (+R20)"> Soft drink (+R20)</label>
                    
                    <label><input type="checkbox" name="extras" value="Extra cheese (+R15)"> Extra cheese (+R15)</label>
                    
                    <label><input type="checkbox" name="extras" value="Mushrooms (+R12)"> Mushrooms (+R12)</label>
                    
                    <label><input type="checkbox" name="extras" value="Pineapple (+R10)"> Pineapple (+R10)</label>
                    
                    <h3>Special requests</h3>
                    
                    <label for="notes">Add any notes about your order:</label>
                    
                    <textarea id="notes" name="notes" placeholder="E.g. no onions, sauce on the side..."></textarea>
                    
                    <p><button type="submit">Place Order</button></p>
                
                </form>
            
            </div>
        
        </main>
        
        <footer>
            
            &copy; 2026 The Food Spot
        
        </footer>
